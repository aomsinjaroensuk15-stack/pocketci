# ============================================================================
# PocketCI — global Gradle properties
# These apply to EVERY module (here: just :app). Gradle reads this file
# before any build script, so it's the right place for JVM tuning and
# Android-wide feature flags.
# ============================================================================

# ---------------------------------------------------------------------------
# MEMORY / DAEMON
# ---------------------------------------------------------------------------
# JVM args for the Gradle daemon. Android builds are hungry; on your PC 2g
# is comfy, on Termux/phone you may need to drop to -Xmx1024m or even 512m
# or the daemon gets OOM-killed mid-build (Termux death #1, ask me how I know).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Reuse build outputs across builds (same task, same inputs → skip re-run).
# On a phone where every gradle invocation costs minutes, this is free life.
org.gradle.caching=true

# Build modules in parallel when the project has more than one.
# Single-module project right now, harmless to keep on for growth.
org.gradle.parallel=true

# Kill the daemon after 5 min idle. Termux RAM is precious; don't let Gradle
# squat on it overnight.
org.gradle.daemon.idletimeout=300000

# ---------------------------------------------------------------------------
# ANDROID FLAGS
# ---------------------------------------------------------------------------
# Non-optional in 2024+: we use AndroidX libraries (Room, WorkManager, etc.).
# Without this the build fails with a wall of "duplicate class" errors because
# old support-library and AndroidX classes collide.
android.useAndroidX=true

# Each module only sees its OWN R classes (app.R only contains app resources,
# not library resources). Kills a whole category of "R cannot be resolved"
# bugs and speeds up compilation. Default in new projects; keep it.
android.nonTransitiveRClass=true

# Where Room dumps its JSON schema on each build. Version-control these files
# in a real project — Room uses them to validate migrations. We point it into
# the app module (overridden there), but declaring the default here means
# forgetting it in :app won't silently write schemas into a random folder.
# (Actual value is set in app/build.gradle.kts with ksp { arg(...) }.)

# ---------------------------------------------------------------------------
# KOTLIN FLAGS
# ---------------------------------------------------------------------------
# Official Kotlin style (4-space indent, trailing commas off, etc.) — matches
# what we write by hand so `./gradlew ktlint`-style checks don't fight us.
kotlin.code.style=official

# Incremental compilation: only recompile changed files + dependents.
# On-device builds are slow; never turn this off.
kotlin.incremental=true

# ---------------------------------------------------------------------------
# SHIZUKU / MISC NOTES
# ---------------------------------------------------------------------------
# Nothing Shizuku-specific lives here — Shizuku is just a Maven dependency
# (Phase 5). These properties only shape HOW Gradle builds, never WHAT the
# app can do at runtime.

# If you ever see "Daemon could not be reused" on Termux, that's normal —
# Termux kills long-running processes. Just re-run the command; the cache
# (org.gradle.caching above) means the second run is fast.
